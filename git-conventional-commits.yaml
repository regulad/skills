# Config for the conventional-commits commit-msg hook
# (qoomon/git-conventional-commits, in .pre-commit-config.yaml), which won't
# run without this file. The commit types are the tool's defaults, copied from
# its git-conventional-commits.default.yaml at v2.9.0. A `convention` block
# must list both `commitTypes` and `commitScopes`. Scopes are free-form; see
# AGENTS.md for the usual ones.
convention:
  commitTypes:
    - feat
    - fix
    - refactor
    - perf
    - style
    - test
    - build
    - ops
    - docs
    - chore
    - merge
    - revert
  commitScopes: []
